[package]
name = "voxel_core"
version = "0.1.0"
edition = "2024"

[dependencies]
glam = { version = "0.32.1", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
rayon = "1.12.0"
ndshape = "0.3.0"
thiserror = "2.0.18"
rustc-hash = "2.1.2"
block-mesh = "0.2.0"
bincode = { version = "2.0", features = ["serde"] }
zstd = "0.13"
bytemuck = { version = "1", features = ["derive"] }

[dependencies.bevy]
version = "0.18"
optional = true

[features]
bevy = ["dep:bevy"]

[dev-dependencies]
proptest = "1"
